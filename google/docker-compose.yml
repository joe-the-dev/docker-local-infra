services:
  pubsub-emulator:
    image: google/cloud-sdk:latest
    container_name: pubsub-emulator
    command: >
      gcloud beta emulators pubsub start
      --project=${PUBSUB_PROJECT_ID}
      --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    environment:
      - PUBSUB_PROJECT_ID=${PUBSUB_PROJECT_ID}
      # Emulator does not validate credentials, but some SDKs still require the env var to be set
      - GOOGLE_APPLICATION_CREDENTIALS=/mock/credentials.json
      - GOOGLE_CLOUD_PROJECT=${PUBSUB_PROJECT_ID}
    volumes:
      - ./mock-credentials.json:/mock/credentials.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:8085/v1/projects/${PUBSUB_PROJECT_ID}/topics",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - google-net

  pubsub-init:
    image: google/cloud-sdk:latest
    container_name: pubsub-init
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=${PUBSUB_PROJECT_ID}
      - PUBSUB_TOPIC=${PUBSUB_TOPIC}
      - PUBSUB_SUBSCRIPTION=${PUBSUB_SUBSCRIPTION}
      # Emulator does not validate credentials, but some SDKs still require the env var to be set
      - GOOGLE_APPLICATION_CREDENTIALS=/mock/credentials.json
      - GOOGLE_CLOUD_PROJECT=${PUBSUB_PROJECT_ID}
    entrypoint: ["/bin/bash", "/init/init-pubsub.sh"]
    volumes:
      - ./init:/init:ro
      - ./mock-credentials.json:/mock/credentials.json:ro
    networks:
      - google-net
    restart: "no"

networks:
  google-net:
    name: google-net
    driver: bridge
